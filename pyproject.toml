[project]
name = "scan-agents"
version = "0.1.0"
description = "Portable Claude-API research pipeline: fan out, score, verify, synthesize."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "openai>=1.30",
    "python-docx>=1.1",
    "pypdf>=4.0",
    "fpdf2>=2.8",
    "plotly>=5.20",
    "pydantic>=2.6",
    "openpyxl>=3.1",
    "python-dotenv>=1.0",
]

[project.scripts]
scan = "scan.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scan"]
